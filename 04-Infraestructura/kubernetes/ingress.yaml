apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innovaretail-ingress
  namespace: innovaretail
spec:
  rules:
    - host: innovaretail.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: innovaretail-service
                port:
                  number: 5000
