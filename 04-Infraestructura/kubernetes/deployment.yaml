apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovaretail-api
  namespace: innovaretail
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: innovaretail-api
  template:
    metadata:
      labels:
        app: innovaretail-api
    spec:
      containers:
        - name: api
          image: innovaretail-api:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: innovaretail-config
            - secretRef:
                name: innovaretail-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
